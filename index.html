<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearLedger — Personal Expense Tracker</title>
    <meta
      name="description"
      content="A clean, minimalist personal expense tracker with dynamic financial dashboard, transaction history, analytics, and monthly budget tracking."
    />
    <meta property="og:title" content="ClearLedger — Personal Expense Tracker" />
    <meta
      property="og:description"
      content="Track income, expenses, analytics, and monthly budgets with instant local persistence."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

    <!-- Typography: Plus Jakarta Sans, DM Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Chart.js & Lucide Icons via CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"
      defer
    ></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Mobile Sidebar Backdrop -->
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <!-- Sidebar Navigation -->
      <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
        <div class="sidebar-header">
          <a href="#dashboard" class="brand-mark" data-nav-link="dashboard">
            <span class="brand-icon" aria-hidden="true">
              <i data-lucide="wallet"></i>
            </span>
            <span class="brand-name">ClearLedger</span>
          </a>
          <button
            type="button"
            id="sidebar-close-btn"
            class="icon-btn mobile-only"
            aria-label="Close navigation menu"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <nav class="sidebar-nav">
          <button
            type="button"
            class="nav-item is-active"
            data-view="dashboard"
            aria-current="page"
          >
            <i data-lucide="layout-dashboard" class="nav-icon"></i>
            <span>Dashboard</span>
          </button>
          <button type="button" class="nav-item" data-view="transactions">
            <i data-lucide="arrow-left-right" class="nav-icon"></i>
            <span>Transactions</span>
          </button>
          <button type="button" class="nav-item" data-view="analytics">
            <i data-lucide="bar-chart-3" class="nav-icon"></i>
            <span>Analytics</span>
          </button>
          <button type="button" class="nav-item" data-view="budget">
            <i data-lucide="piggy-bank" class="nav-icon"></i>
            <span>Budget</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-section-label">Data Utilities</div>
          <button type="button" id="export-csv-btn" class="sidebar-utility-btn">
            <i data-lucide="download" class="utility-icon"></i>
            <span>Export CSV</span>
          </button>
          <button type="button" id="reset-demo-btn" class="sidebar-utility-btn">
            <i data-lucide="rotate-ccw" class="utility-icon"></i>
            <span>Reset Sample Data</span>
          </button>
          <button
            type="button"
            id="clear-all-btn"
            class="sidebar-utility-btn sidebar-utility-danger"
          >
            <i data-lucide="trash-2" class="utility-icon"></i>
            <span>Clear All Data</span>
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <div class="workspace">
        <!-- Top Navigation Bar -->
        <header class="topbar">
          <div class="topbar-left">
            <button
              type="button"
              id="sidebar-open-btn"
              class="icon-btn mobile-only"
              aria-label="Open navigation menu"
              aria-expanded="false"
              aria-controls="sidebar"
            >
              <i data-lucide="menu"></i>
            </button>
            <div class="breadcrumb" aria-label="Breadcrumb">
              <span class="breadcrumb-root">Workspace</span>
              <span class="breadcrumb-sep" aria-hidden="true">/</span>
              <h1 id="topbar-title" class="breadcrumb-current">Dashboard</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="month-picker-wrap">
              <label for="global-month-select" class="sr-only">Active Month</label>
              <select
                id="global-month-select"
                class="select-control topbar-month-select"
                title="Select active month for monthly summaries"
              ></select>
            </div>
            <button
              type="button"
              id="open-add-tx-btn"
              class="btn btn-primary"
            >
              <i data-lucide="plus" class="btn-icon"></i>
              <span>Add Transaction</span>
            </button>
          </div>
        </header>

        <!-- Dynamic View Container -->
        <main id="app-main" class="main-content" tabindex="-1">
          <!-- Views rendered dynamically by JS modules -->
        </main>
      </div>
    </div>

    <!-- Add / Edit Transaction Modal -->
    <div
      id="tx-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tx-modal-title"
      hidden
    >
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="tx-modal-title" class="modal-title">Add Transaction</h2>
          <button
            type="button"
            id="tx-modal-close"
            class="icon-btn"
            aria-label="Close transaction form"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="tx-form" class="modal-body" novalidate>
          <input type="hidden" id="tx-id" name="id" />

          <!-- Type Segmented Selector -->
          <div class="form-group">
            <span class="form-label">Transaction Type</span>
            <div class="segmented-control segmented-full" role="radiogroup" aria-label="Transaction Type">
              <button
                type="button"
                class="segmented-btn is-active"
                data-tx-type="expense"
                aria-pressed="true"
              >
                Expense
              </button>
              <button
                type="button"
                class="segmented-btn"
                data-tx-type="income"
                aria-pressed="false"
              >
                Income
              </button>
            </div>
            <input type="hidden" id="tx-type" name="type" value="expense" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="tx-title" class="form-label">
                Title <span class="required-mark">*</span>
              </label>
              <input
                type="text"
                id="tx-title"
                name="title"
                class="input-control"
                placeholder="e.g., Grocery Shopping"
                maxlength="80"
                required
              />
              <span class="field-error" id="err-tx-title" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="tx-amount" class="form-label">
                Amount (USD) <span class="required-mark">*</span>
              </label>
              <input
                type="number"
                id="tx-amount"
                name="amount"
                class="input-control mono-input"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
              />
              <span class="field-error" id="err-tx-amount" aria-live="polite"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="tx-category" class="form-label">
                Category <span class="required-mark">*</span>
              </label>
              <select id="tx-category" name="category" class="select-control" required></select>
              <span class="field-error" id="err-tx-category" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="tx-date" class="form-label">
                Date <span class="required-mark">*</span>
              </label>
              <input
                type="date"
                id="tx-date"
                name="date"
                class="input-control mono-input"
                required
              />
              <span class="field-error" id="err-tx-date" aria-live="polite"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="tx-description" class="form-label">Description</label>
            <textarea
              id="tx-description"
              name="description"
              class="textarea-control"
              rows="2"
              maxlength="200"
              placeholder="Optional note (e.g., Weekly groceries)"
            ></textarea>
            <span class="field-error" id="err-tx-description" aria-live="polite"></span>
          </div>

          <div class="modal-footer">
            <button type="button" id="tx-cancel-btn" class="btn btn-secondary">
              Cancel
            </button>
            <button type="submit" id="tx-submit-btn" class="btn btn-primary">
              Save Transaction
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirmation Modal (Delete / Clear / Reset) -->
    <div
      id="confirm-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      hidden
    >
      <div class="modal-panel modal-panel-sm">
        <div class="modal-header">
          <h2 id="confirm-modal-title" class="modal-title">Confirm Action</h2>
          <button
            type="button"
            id="confirm-modal-close"
            class="icon-btn"
            aria-label="Close confirmation dialog"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <p id="confirm-modal-message" class="confirm-message"></p>
          <div class="modal-footer">
            <button type="button" id="confirm-cancel-btn" class="btn btn-secondary">
              Cancel
            </button>
            <button type="button" id="confirm-ok-btn" class="btn btn-danger">
              Confirm
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
